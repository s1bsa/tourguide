version: '3.8'

services:
  yoloapi:
    build: ./yolo_service
    image: yoloapi_image
    container_name: yoloapi
    environment:
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: http://database:7000
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json 
    volumes:
      - ./firebase-key.json:/app/firebase-key.json 
    ports:
      # Application Port
      - "8000:8000"
      # Metrics port
      - "8002:8002" 
    depends_on:
      - database
      - rabbitmq
      - rabbitmq-exporter # Dependency for full monitoring setup
    networks:
      - backend

  database:
    build: ./database
    image: db_manager_image
    container_name: database
    volumes:
      - ./data/db:/app/data
    ports:
      # Application port
      - "7000:7000"
      # Metrics port (NEW)
      - "8001:8001" 
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      # Standard RabbitMQ port
      - "5672:5672"
      # Management UI port
      - "15672:15672"
    networks:
      - backend

  post_processor:
    build: ./post_processor
    image: post_processor_image
    container_name: post_processor
    environment:
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: http://database:7000
      YOLO_API_URL: http://yoloapi:8000
    ports:
      # Metrics port (NEW)
      - "8003:8003"
    depends_on:
      - rabbitmq
      - database
      - yoloapi
    networks:
      - backend


  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter 
    container_name: rabbitmq_exporter
    environment:
      RABBIT_URL: http://rabbitmq:15672 # Target the RabbitMQ management API
      RABBIT_USER: guest 
      RABBIT_PASSWORD: guest 
    ports:
      - "9419:9419" # Exposes exporter metrics port
    depends_on:
      - rabbitmq
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest 
    container_name: prometheus
    ports:
      - '9090:9090' # Prometheus UI port
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - yoloapi
      - database
      - post_processor
      - rabbitmq-exporter
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest 
    container_name: grafana
    ports:
      - '3000:3000' # Grafana UI port
    depends_on:
      - prometheus 
    networks:
      - backend

networks:
  backend:
    driver: bridge