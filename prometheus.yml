global:
  scrape_interval: 15s 

# A list of scrape configurations.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'database' 
    static_configs:
      - targets: ['database:8001'] 

  - job_name: 'uploader' # yolo api
    static_configs:
      - targets: ['yoloapi:8002'] 

  - job_name: 'worker' # post_processor
    static_configs:
      - targets: ['post_processor:8003'] 

  - job_name: 'rabbitmq' 
    static_configs:
      - targets: ['rabbitmq-exporter:9419']